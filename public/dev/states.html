<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רדאר קייט — גלריית מצבים</title>
<link rel="stylesheet" href="../styles.css">
<style>
  .gal-h { margin: 22px 2px 8px; font-size: 12px; font-weight: 800;
           letter-spacing: .06em; color: var(--text-3); }
  .gal-bar { display:flex; gap:8px; padding:10px 2px; position:sticky;
             inset-block-start:0; background:var(--bg); z-index:5; }
  .gal-bar button { padding:7px 14px; border:1px solid var(--border);
                    border-radius:999px; background:var(--surface); font-size:13px; }
  .gal-dials { display:flex; flex-wrap:wrap; gap:10px; }
  .gal-dial { margin:0; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .gal-dial figcaption { font-size:12px; color:var(--text-3); font-weight:700; }
</style>
</head>
<body>
<div class="app">
  <div class="gal-bar">
    <button id="t">בהיר / כהה</button>
    <button id="w">375 / 600</button>
  </div>
  <main id="cards" class="cards"></main>
</div>

<script type="module">
import { renderCard, renderDetail } from '../js/ui/card.js';
import { scoreSpot } from '../js/verdict/engine.js';
import { makeUserSpot } from '../js/userspots.js';
import { renderDial } from '../js/ui/dial.js';
import { headlineModelFor } from '../js/sources/openmeteo.js';

if (location.search.includes('dark')) document.documentElement.dataset.theme = 'dark';

const reg = await (await fetch('../data/spots.json')).json();
/**
 * הרג'יסטר משתנה — ספוטים נגזמים ומזהים משתנים. הגלריה לא אמורה
 * ליפול עם stack trace כשזה קורה; היא אמורה לומר מה חסר.
 */
const missing = [];
const S = (id, fallbackRegion) => {
  const hit = reg.spots.find(s => s.id === id);
  if (hit) return hit;
  missing.push(id);
  return reg.spots.find(s => s.region === fallbackRegion) || reg.spots[0];
};

/** בונה יום סינתטי: פרופיל תרמי עם שיא בשעה peak */
function day({ peak = 15, peakHour = 15, gustRatio = 1.25, dir = 290, holes = [] }) {
  return Array.from({ length: 24 }, (_, h) => {
    const kt = holes.includes(h) ? null
      : Math.max(2, peak * Math.exp(-((h - peakHour) ** 2) / 26));
    return { hour: h, dayIndex: 0, tsMs: null,
             speedKt: kt, gustKt: kt == null ? null : kt * gustRatio, dirDeg: dir };
  });
}

const NOW = Date.UTC(2026, 7, 18, 10);   // 18/8/2026, 13:00 שעון ישראל

/** ספוט משתמש סינתטי — אותו נתון כמו בת ים, ובכל זאת לא ירוק */
const MINE = makeUserSpot({ id: 'u-demo', name: 'החוף מול הקראוונים',
                            lat: 32.0158, lon: 34.7395, shoreNormalDeg: 292 });

/** משכפל יום סינתטי לשלושה, עם דעיכה — כדי שהמטאוגרם יראה מה שהוא יראה בפועל */
function threeDays(day0) {
  const out = [];
  for (let d = 0; d < 3; d++) {
    const k = [1, 0.78, 0.55][d];
    for (const h of day0) {
      out.push({ ...h, dayIndex: d,
                 speedKt: h.speedKt == null ? null : +(h.speedKt * k).toFixed(1),
                 gustKt: h.gustKt == null ? null : +(h.gustKt * k).toFixed(1),
                 dirDeg: (h.dirDeg + d * 12) % 360 });
    }
  }
  return out;
}

/**
 * מדידה חיה סינתטית.
 *
 * ⚠️ עד 20/8/2026 הגלריה העבירה `null` למדידה, ולכן **רצועת המדידה
 * ופסקת המקור לא נבדקו כאן מעולם** — שני האלמנטים שנוגעים ישירות
 * באמון במספר. הם נבדקים עכשיו בכל חמשת המצבים שלהם.
 */
function obs({ kt = 20, gust = 24, dir = 300, fcAt = 18, ageMin = 2, rep = true,
               name = 'מד הרוח של Surf Center — על חוף הקייט', km = 0.02 } = {}) {
  return { speedKt: kt, gustKt: gust, dirDeg: dir, ageMin,
           forecastAtObsKt: fcAt, tsMs: NOW - ageMin * 60000,
           representative: rep, source: rep ? 'club' : 'ims',
           stationName_he: name, distanceKm: km, feed: { state: 'fresh' } };
}

const CASES = [
  ['ירוק — יום קלאסי', S('bat-yam', 'center'), day({ peak: 19, dir: 300 }), NOW],
  ['ירוק — רוח חזקה', S('betzet', 'north'), day({ peak: 26, peakHour: 14, dir: 285 }), NOW],
  ['צהוב — גבולי', S('shavei-tzion', 'north'), day({ peak: 14, dir: 280 }), NOW],
  ['צהוב — משבים', S('bat-galim', 'north'), day({ peak: 18, gustRatio: 1.75, dir: 300 }), NOW],
  ['אדום — רוח מהחוף החוצה', S('bat-yam', 'center'), day({ peak: 22, dir: 90 }), NOW],
  ['אדום — אין רוח', S('achziv', 'north'), day({ peak: 7, dir: 280 }), NOW],
  ['חריג מנוהל — אילת צפונית', S('eilat-reef-raf', 'eilat'), day({ peak: 20, peakHour: 16, dir: 5 }), NOW],
  ['אסור — תל אביב ביולי', S('tel-aviv', 'center'), day({ peak: 20, dir: 300 }), Date.UTC(2026, 6, 15, 10)],
  ['מחוץ לעונה — כנרת בינואר', S('kinneret-diamond', 'kinneret'), day({ peak: 20, dir: 270 }), Date.UTC(2026, 0, 15, 10)],
  ['אין נתונים', S('bat-yam', 'center'), [], NOW],
  ['נתון ישן', S('bat-yam', 'center'), day({ peak: 19, dir: 300 }), NOW, 120],
  ['חורים בנתונים', S('betzet', 'north'), day({ peak: 18, dir: 290, holes: [10, 11, 16] }), NOW],
  // שלב 6 — אותה רוח שנותנת ירוק בספוט ליבה, חסומה על צהוב כאן
  ['ספוט שהמשתמש הוסיף', MINE, day({ peak: 19, dir: 300 }), NOW],

  /* ---- דיוק ואמון: חמשת מצבי המדידה ---- */
  ['מדידה מובילה — האנמומטר על החוף עצמו',
   S('hadera', 'center'), day({ peak: 18, dir: 300 }), NOW, 3, obs({ kt: 21, fcAt: 18 })],
  ['תחזית מובילה — תחנה אזורית רחוקה',
   S('beit-yanai', 'center'), day({ peak: 18, dir: 300 }), NOW, 3,
   obs({ kt: 21, fcAt: 18, rep: false, name: 'תחנת HADERA PORT', km: 9.9 })],
  ['מדידה חלוקה — פער שמוריד דרגה',
   S('hadera', 'center'), day({ peak: 19, dir: 300 }), NOW, 3, obs({ kt: 11, gust: 14, fcAt: 19 })],
  ['אדום — המדידה חזקה, ופסק הדין עדיין מוביל',
   S('bat-yam', 'center'), day({ peak: 22, dir: 90 }), NOW, 3, obs({ kt: 24, gust: 29, dir: 92, fcAt: 22 })],
  ['כיוון נמדד מסוכן — המהירויות תואמות',
   S('hadera', 'center'), day({ peak: 18, dir: 300 }), NOW, 3, obs({ kt: 18, dir: 100, fcAt: 18 })],
];

const host = document.querySelector('#cards');

// ?only=dials — פס החוגות בלבד. גלריה בת 3400 פיקסלים אינה ניתנת
// לבדיקה ויזואלית בצילום אחד, וחוגה שגויה מתגלה רק כשרואים אותה בגודל.
// ?only=live — רק המצבים שיש בהם מדידה חיה, מאותה סיבה בדיוק.
const ONLY = new URLSearchParams(location.search).get('only');

const SHOWN = ONLY === 'live' ? CASES.filter(c => c[5]) : CASES;

host.innerHTML = ONLY === 'dials' ? '' : SHOWN.map(([label, spot, hours, now, ageMin = 3, ob = null]) => {
  const fc = { hours, ageMin };
  const v = scoreSpot(spot, fc, ob, now, { weightKg: 75 }, 0);
  const model = headlineModelFor(spot);
  return `<p class="gal-h">${label}</p>` +
         renderCard(spot, v, { hours, nowHour: 13.5, model }) +
         renderDetail(spot, v, {
           model,
           grid: { distanceKm: 4.2 },
           prefs: { weightKg: 75, quiver: [7, 9, 12] },
           allHours: threeDays(hours),
           nowHour: 13.5,
           windows: v.window?.startHour != null
             ? [{ dayIndex: 0, startHour: v.window.startHour, endHour: v.window.endHour }] : [],
         });
}).join('');

if (missing.length && ONLY !== 'dials') {
  const p = document.createElement('p');
  p.className = 'gal-h';
  p.style.color = 'var(--no)';
  p.textContent = 'ספוטים שלא נמצאו ברג׳יסטר והוחלפו בתחליף מאותו אזור: ' + [...new Set(missing)].join(' · ');
  host.prepend(p);
}

// ---- פס החוגות. שינוי בגיאומטריה נראה כאן לפני שהוא נראה במסך החי ----
const DIALS = [0, 45, 90, 180, 270, 292, 359];
host.insertAdjacentHTML('beforeend',
  '<p class="gal-h">חוגת כיוון החוף — הרצועה האדומה חייבת לשבת מול הניצב</p>' +
  '<div class="gal-dials">' +
  DIALS.map(d => `<figure class="as-dial gal-dial">${renderDial(d, { size: 132 })}` +
                 `<figcaption><span dir="ltr">${d}°</span></figcaption></figure>`).join('') +
  '</div>');

document.querySelector('#t').onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark';
};
document.querySelector('#w').onclick = () => {
  const a = document.querySelector('.app');
  a.style.maxWidth = a.style.maxWidth === '375px' ? '620px' : '375px';
};
</script>
</body>
</html>
