#==========================================================================
# רדאר קייט — Worker ההתראות בטלגרם
#--------------------------------------------------------------------------
# ⚠️ זה ה־Worker היחיד בפרויקט, והמקום היחיד שמחזיק סוד.
#    הסודות עצמם **אינם כאן** ולעולם לא ייכנסו לקובץ הזה:
#
#      wrangler secret put TG_BOT_TOKEN
#      wrangler secret put TG_WEBHOOK_SECRET
#
#    לפיתוח מקומי הם יושבים ב-worker/.dev.vars, שמכוסה ב-.gitignore.
#
# ⚠️ `wrangler deploy` נוגע רק בתיקייה הזו. האתר עצמו נפרס ב-git push
#    ואין לו פקודת פריסה. שני מסלולים נפרדים, בכוונה.
#==========================================================================

name = "kite-alerts"
main = "alerts.js"
compatibility_date = "2026-08-01"

# כתובת האתר החי. ממנה נטענים גם spots.json וגם /api/obs.
# ⚠️ להחליף אם כתובת ה-Pages משתנה — אחרת ה-cron מקבל 404 ושותק.
[vars]
SITE_URL = "https://kite-radar.pages.dev"

#--------------------------------------------------------------------------
# KV — המנויים ומפת "מה כבר נשלח".
# ⚠️ ה-id למטה הוא מציין מקום. להריץ:
#
#      wrangler kv namespace create KITE_SUBS
#
#    ולהדביק לכאן את ה-id שהפקודה מדפיסה. בלי זה הפריסה נכשלת.
#--------------------------------------------------------------------------
[[kv_namespaces]]
binding = "KITE_SUBS"
id = "REPLACE_WITH_ID_FROM_WRANGLER_KV_NAMESPACE_CREATE"

#--------------------------------------------------------------------------
# ⚠️ cron של Cloudflare הוא **UTC תמיד** ואינו מכיר שעון קיץ.
#    04/10/15 UTC נוחתים על:
#      חורף (UTC+2)  →  06:00 · 12:00 · 17:00 שעון ישראל
#      קיץ  (UTC+3)  →  07:00 · 13:00 · 18:00 שעון ישראל
#    שעות שקט של המשתמש נבדקות בקוד לפי Asia/Jerusalem, ולכן ריצה
#    שנוחתת מוקדם מדי בחורף תדלג על מי שהגדיר שקט — ולא תעיר אותו.
#--------------------------------------------------------------------------
[triggers]
crons = ["0 4,10,15 * * *"]

[observability]
enabled = true
